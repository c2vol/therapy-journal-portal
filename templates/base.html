<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Journal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <span class="brand">Between sessions</span>
    {% if g.key %}
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link">Lock</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% for msg in get_flashed_messages() %}<p class="flash">{{ msg }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>
    If you're in crisis or thinking about harming yourself, call or text 988 (US) or your local emergency number.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
